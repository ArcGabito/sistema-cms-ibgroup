# Development stack: the client and server images plus a SQL Server
# instance. The db service is for local development only — in production,
# run the two images against a managed database instead, by setting the
# server's ConnectionStrings__DefaultConnection.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ibgroup-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env (repo root)}
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: ibgroup-server
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Development only: connects as sa, and EF Core creates the database
      # and applies the migrations on startup.
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=IBGroupCMS;User Id=sa;Password=${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env (repo root)};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (repo root)}
      Jwt__Issuer: IBGroupCMS
      Jwt__Audience: IBGroupCMS
      Seed__AdminUsername: ${SEED_ADMIN_USERNAME:-admin}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env (repo root)}
      Seed__AdminFullName: ${SEED_ADMIN_FULLNAME:-Administrador}
      Ai__ApiKey: ${ANTHROPIC_API_KEY:-}
      Ai__Model: ${AI_MODEL:-claude-haiku-5-5}
      Uploads__Path: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    container_name: ibgroup-client
    environment:
      BACKEND_URL: http://server:8080
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  db-data:
  uploads:
